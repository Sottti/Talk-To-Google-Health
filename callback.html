<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Health — setup code</title>
<style>
body{font-family:system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}
#code{font-family:ui-monospace,monospace;font-size:1.1rem;word-break:break-all;background:#f4f4f4;border:1px solid #ddd;border-radius:8px;padding:1rem}
button{font-size:1rem;padding:.6rem 1.2rem;border-radius:8px;border:1px solid #1a73e8;background:#1a73e8;color:#fff;cursor:pointer}
#copied{color:#1a73e8;display:none;margin-left:.6rem}
.err{color:#b3261e}
</style>
</head>
<body>
<h1>Echo Health — setup</h1>
<div id="ok" style="display:none">
<p>Google approved the connection. Copy this one-time code and paste it into your chat with Echo:</p>
<div id="code"></div>
<p><button id="copy">Copy code</button><span id="copied">Copied!</span></p>
<p>The code expires in a few minutes and can only be used once.</p>
</div>
<div id="fail" style="display:none">
<p class="err">No code received. <span id="emsg"></span> Please go back and try approving again.</p>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), err = q.get("error");
  if (code) {
    document.getElementById("ok").style.display = "block";
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = function(){
      navigator.clipboard.writeText(code).then(function(){
        document.getElementById("copied").style.display = "inline";
      });
    };
  } else {
    document.getElementById("fail").style.display = "block";
    if (err) document.getElementById("emsg").textContent = "(" + err + ")";
  }
})();
</script>
</body>
</html>
